<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <div class="container my-5">
      <div class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="card-title mb-4 text-center">Registro de Usuarios</h2>

          <form id="formulario" novalidate>
            <div class="row g-3">
              <div class="col-12 col-md-3">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="inputNombre"
                    placeholder="Nombre completo"
                    required
                  />
                  <label for="inputNombre">Nombre completo</label>
                  <div class="invalid-feedback">
                    Solo se permiten letras y espacios (sin caracteres
                    especiales ni números).
                  </div>
                </div>
              </div>
              <div class="col-12 col-md-3">
                <div class="form-floating">
                  <input
                    type="email"
                    class="form-control"
                    id="inputEmail"
                    placeholder="name@example.com"
                    required
                  />
                  <label for="inputEmail">Correo electrónico</label>
                  <div class="invalid-feedback">
                    Ingresa un correo electrónico válido.
                  </div>
                </div>
              </div>
              <div class="col-12 col-md-3">
                <div class="form-floating">
                  <input
                    type="tel"
                    class="form-control"
                    id="inputTelefono"
                    placeholder="7890-1234"
                    maxlength="9"
                    required
                  />
                  <label for="inputTelefono">Teléfono (####-####)</label>
                  <div class="invalid-feedback">
                    El formato debe ser ####-####.
                  </div>
                </div>
              </div>
              <div class="col-12 col-md-3">
                <div class="form-floating">
                  <input
                    type="text"
                    class="form-control"
                    id="inputDui"
                    placeholder="12345678-9"
                    maxlength="10"
                    required
                  />
                  <label for="inputDui">DUI (########-#)</label>
                  <div class="invalid-feedback">
                    El DUI debe tener el formato ########-#.
                  </div>
                </div>
              </div>
            </div>

            <div class="mt-4 text-end">
              <button type="submit" class="btn btn-primary px-4">
                Guardar Registro
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- Tabla de Registros -->
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3">Registros Guardados</h3>

          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Correo</th>
                  <th scope="col">Teléfono</th>
                  <th scope="col">DUI</th>
                </tr>
              </thead>
              <tbody id="tablaCuerpo">
                <tr id="filaVacia">
                  <td colspan="5" class="text-center text-muted">
                    No hay registros agregados aún.
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script src="index.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
